<!DOCTYPE html>
<html>
  <head>
    <title>Product Display</title>
  </head>
  <body>
    {%include 'header.html'%}
    <h1>Product List</h1>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        {%if products%} {%for product in products%}
        <tr>
          <td>{{product.name}}</td>
          <td>{{product.category}}</td>
          <td>{{product.price}}</td>
        </tr>
        {%endfor%} {%endif%}
      </tbody>
    </table>
    {%if error%}
    <p>{{error}}</p>
    {%endif%} {%include 'footer.html'%}
  </body>
</html>
